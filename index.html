<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>윤철진 작품 목록</title>
<style>
:root{--bg:#14213d;--gold:#e7c46a;--cream:#f6f1e7;--card:#fbf9f4;--ink:#1e1e1e;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Malgun Gothic','Noto Sans KR',sans-serif}
header{text-align:center;padding:22px 16px 6px}
h1{margin:0;font-size:1.5rem;color:var(--gold);letter-spacing:.05em}
header p{margin:6px 0 0;color:#b8c0d0;font-size:.9rem}
.nav{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 16px}
.nav button,.nav select{background:#22325a;color:var(--cream);border:1px solid #3a4b78;border-radius:6px;padding:8px 14px;font-size:1rem;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{min-width:90px;text-align:center}
main{max-width:1200px;margin:0 auto;padding:6px 16px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
figure{margin:0;background:var(--card);border-radius:8px;overflow:hidden}
figure a{display:block;background:#e9e4d8}
figure img{width:100%;aspect-ratio:3/4;object-fit:contain;display:block}
figcaption{padding:10px 14px;font-weight:bold;color:var(--red);font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
figcaption label{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-size:.95rem;padding:4px 6px}
figcaption input{width:28px;height:28px;accent-color:var(--red);cursor:pointer}
figure.sel{outline:4px solid var(--gold)}
figure.sel figcaption{background:#fff3cf}
.count{width:100%;text-align:center;font-size:1.15rem;color:var(--cream)}
.count b{color:var(--gold);font-size:1.5rem}
#list{display:none;max-width:1000px;margin:0 auto 16px;padding:12px 16px;background:#22325a;border-radius:8px;line-height:1.7;word-break:break-all}
@media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){main{grid-template-columns:1fr}}
@media print{body{background:#fff}header,.nav{display:none}main{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>윤철진 작품 목록</h1>
  <p>한 페이지 6점 · 이미지를 누르면 크게 열립니다</p>
</header>
<div class="nav">
  <button id="first">«</button><button id="prev">‹ 이전</button>
  <span id="info"></span>
  <button id="next">다음 ›</button><button id="last">»</button>
  <select id="jump"></select>
</div>
<div class="nav">
  <div class="count">현재 선택한 작품수는? <b id="cnt">0</b>개</div>
  <button id="showlist">선택 목록 보기</button>
  <button id="copylist">목록 복사</button>
  <button id="sendlist">선택 결과 보내기</button>
  <button id="clearall">전체 해제</button>
</div>
<div id="list"></div>
<main id="grid"></main>
<div class="nav">
  <button id="prev2">‹ 이전</button><button id="next2">다음 ›</button>
</div>
<script>
const TOTAL=294, PER=6, PAGES=Math.ceil(TOTAL/PER);
let page=1;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(4,'0');
const KEY='cj_selected_v1';
let sel=new Set();
try{sel=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...sel]))}catch(e){}};
const names=()=>[...sel].sort((a,b)=>a-b).map(n=>'CJ'+pad(n));
function upd(){
  $('cnt').textContent=sel.size;
  if($('list').style.display==='block')$('list').textContent=names().join(', ')||'(선택한 작품이 없습니다)';
}
$('showlist').onclick=()=>{const l=$('list');l.style.display=l.style.display==='block'?'none':'block';upd()};
$('copylist').onclick=()=>{const t=names().join(', ');
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert(sel.size+'개 목록을 복사했습니다.')).catch(()=>{$('list').style.display='block';upd();alert('복사가 막혀 있습니다. 아래 목록을 직접 복사해 주세요.')})};
// 선택 결과를 문구+확인 링크로 만들어 공유(휴대폰은 카톡 등 공유창, PC는 복사)
function shareText(){
  const nums=[...sel].sort((a,b)=>a-b);
  const url=location.origin+location.pathname+'?sel='+nums.join('.');
  return '[윤철진 작품 선택] '+nums.length+'점\n'+names().join(', ')+'\n\n확인 링크: '+url;
}
$('sendlist').onclick=async()=>{
  if(!sel.size){alert('선택한 작품이 없습니다.');return}
  const t=shareText();
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile&&navigator.share){try{await navigator.share({text:t});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(t);alert('선택 결과 '+sel.size+'점을 복사했습니다.\n카카오톡 PC 대화창을 열고 Ctrl+V로 붙여넣어 보내 주세요.')}
  catch(e){$('list').style.display='block';$('list').textContent=t;alert('복사가 막혀 있습니다. 아래 글을 직접 복사해 카카오톡으로 보내 주세요.')}
};
// 확인 링크(?sel=1.5.9)로 열면 그 선택을 화면에 불러옴
(function(){const q=new URLSearchParams(location.search).get('sel');
  if(q){const arr=q.split('.').map(Number).filter(n=>n>=1&&n<=294);
    if(arr.length){sel=new Set(arr);save();}}})();
$('clearall').onclick=()=>{if(sel.size&&confirm('선택한 '+sel.size+'개를 모두 해제할까요?')){sel.clear();save();go(1)}};
const jump=$('jump');
for(let p=1;p<=PAGES;p++){const a=(p-1)*PER+1,b=Math.min(p*PER,TOTAL);
  jump.add(new Option(`${p}쪽 (CJ${pad(a)}~CJ${pad(b)})`,p));}
function render(){
  const g=$('grid'); g.innerHTML='';
  const a=(page-1)*PER+1, b=Math.min(page*PER,TOTAL);
  for(let n=a;n<=b;n++){
    const id='CJ'+pad(n);
    const on=sel.has(n);
    g.insertAdjacentHTML('beforeend',
      `<figure class="${on?'sel':''}"><a href="img/${id}.jpg" target="_blank"><img src="img/${id}.jpg" alt="${id}" loading="lazy"></a><figcaption><span>${id}</span><label>선택 <input type="checkbox" data-n="${n}" ${on?'checked':''}></label></figcaption></figure>`);
  }
  g.querySelectorAll('input[data-n]').forEach(c=>c.onchange=()=>{
    const n=+c.dataset.n; c.checked?sel.add(n):sel.delete(n);
    c.closest('figure').classList.toggle('sel',c.checked); save(); upd();});
  $('info').textContent=`${page} / ${PAGES} 쪽`;
  jump.value=page;
  for(const i of ['first','prev','prev2']) $(i).disabled=page===1;
  for(const i of ['last','next','next2']) $(i).disabled=page===PAGES;
  upd(); location.hash=page; window.scrollTo(0,0);
}
const go=p=>{page=Math.max(1,Math.min(PAGES,p));render()};
$('first').onclick=()=>go(1); $('last').onclick=()=>go(PAGES);
for(const i of ['prev','prev2']) $(i).onclick=()=>go(page-1);
for(const i of ['next','next2']) $(i).onclick=()=>go(page+1);
jump.onchange=()=>go(+jump.value);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(page-1);if(e.key==='ArrowRight')go(page+1)});
page=Math.max(1,Math.min(PAGES,parseInt(location.hash.slice(1))||1));
render();
</script>
</body>
</html>
